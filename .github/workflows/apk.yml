name: Build APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Kunci tanda tangan (opsional, dari secrets)
        env:
          KS_BASE64: ${{ secrets.KS_BASE64 }}
        run: |
          if [ -n "$KS_BASE64" ]; then
            echo "$KS_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KS_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Memakai kunci rilis dari secrets."
          else
            echo "Secrets kunci belum diatur: APK ditandatangani dengan kunci debug."
          fi

      - name: Build APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Terbitkan rilis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk AturKaryawan-SLRT.apk
          ls -la AturKaryawan-SLRT.apk
          gh release create "apk-v${{ github.run_number }}" AturKaryawan-SLRT.apk \
            --title "Atur Karyawan APK v1.0.${{ github.run_number }}" \
            --notes "APK Android untuk app Atur Karyawan PT SLRT. Unduh AturKaryawan-SLRT.apk lalu pasang di HP. Isi app selalu mengikuti versi terbaru di GitHub Pages." \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: AturKaryawan-SLRT-apk
          path: AturKaryawan-SLRT.apk
