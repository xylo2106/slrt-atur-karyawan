<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Atur Karyawan – Jadwal & Pesan WA</title>
<style>
:root{--pri:#13295e;--pri2:#2c4a99;--acc:#c81e2b;--pribg:#e6ebf6;--bg:#f7f8fa;--ink:#16181d;--mut:#8b909c;--line:#eceef3;--chip:#f2f3f7;--ok:#1f9d55;--danger:#d63a3a;--sh:0 2px 14px rgba(30,30,60,.07);--bub:#d9fdd3;--bubfg:#111b21;--bubbg:#efeae2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#e7e9ee}
body{margin:0 auto;max-width:560px;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.45 'Plus Jakarta Sans',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:104px;position:relative}
body.q{padding-bottom:196px}
#top.home::after{content:"";display:block;height:3px;width:56px;margin-top:16px;border-radius:3px;background:var(--acc)}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font-family:inherit}
/* header */
#top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px}
#top.home{position:static;padding-top:calc(22px + env(safe-area-inset-top))}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar h2{margin:0;font-size:19px;font-weight:700}
.back{width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:#fff;font-size:24px;line-height:1;color:var(--pri);cursor:pointer;box-shadow:var(--sh)}
.hello{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hello h1{margin:0;font-size:27px;line-height:1.15;font-weight:700}
.hello .nm{display:block;border:0;background:none;padding:0;font:inherit;font-size:27px;font-weight:700;color:var(--ink);text-align:left;cursor:pointer}
.hello .nm small{font-size:13px;color:var(--mut);font-weight:600;margin-left:4px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.logo{display:block;width:190px;height:auto}
.logo2{width:92px;height:auto;margin-left:10px}
.bar .sync{margin-left:auto}
.sync{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 11px 6px 9px;font:inherit;font-size:11.5px;font-weight:700;color:var(--mut);box-shadow:var(--sh);cursor:pointer;flex:none}
.sync i{width:8px;height:8px;border-radius:50%;background:#aab0bd;flex:none}
.sync.s-ok{color:#168a47}.sync.s-ok i{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.sync.s-saving{color:#b7791f}.sync.s-saving i{background:#f5a623;animation:pl 1s infinite}
.sync.s-load i{animation:pl 1s infinite}
.sync.s-err{color:#c0262d}.sync.s-err i{background:#e5484d}
.sync.dot{padding:9px}.sync.dot b{display:none}
@keyframes pl{50%{opacity:.3}}
.avatar,.av{display:grid;place-items:center;border-radius:50%;color:#fff;font-weight:700;background:linear-gradient(135deg,#3a5bb0,#13295e);flex:none}
.avatar{width:58px;height:58px;font-size:20px;box-shadow:0 6px 16px rgba(19,41,94,.35)}
.av{width:38px;height:38px;font-size:13px}
#datebar{display:flex;gap:6px;align-items:center}
#datebar input{flex:1;min-width:0}
main{padding:6px 16px 0}
/* cards */
.card{background:#fff;border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:var(--sh);border:1px solid #f1f2f6;scroll-margin-top:130px}
.h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
h3{margin:0;font-size:15px;font-weight:700}
h4{margin:14px 0 6px;font-size:12.5px;color:var(--mut);font-weight:700}
.mut{color:var(--mut)}.sm{font-size:12.5px}
.cols{display:block}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--chip);border:1.5px solid transparent;border-radius:12px;padding:11px 12px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);background:#fff;box-shadow:0 0 0 3px rgba(19,41,94,.12)}
textarea{width:100%;min-height:96px;font-size:14px;line-height:1.45}
.fld{display:block;margin-bottom:10px;font-size:12.5px;color:var(--mut);font-weight:600}.fld input,.fld select{display:block;width:100%;margin-top:4px}
.btn{font:inherit;font-weight:600;font-size:14.5px;border:1px solid var(--line);background:#fff;color:var(--ink);min-height:44px;padding:10px 15px;border-radius:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sm{min-height:38px;padding:7px 12px;font-size:13px}
.btn:active,.sc:active,.pc:active,.cell:active,.tile:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(135deg,#27478f,#13295e);color:#fff;border:0;box-shadow:0 6px 16px rgba(19,41,94,.32)}
.btn.wa{background:linear-gradient(135deg,#2fd270,#18a957);color:#fff;border:0;box-shadow:0 6px 16px rgba(24,169,87,.3)}
.btn.danger{color:var(--danger);border-color:#f6cfcf}
.lnk{border:0;background:none;color:var(--pri);font:inherit;font-weight:700;font-size:13px;padding:4px 0;cursor:pointer;text-decoration:none}
.row{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}.grow{flex:1;min-width:0}
.x{border:0;background:transparent;color:var(--mut);font-size:17px;cursor:pointer;min-width:44px;min-height:44px}
.area{border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;background:#fcfcfd}
.arow{display:flex;gap:6px;margin-bottom:8px;align-items:center}.kode{width:120px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.chip{background:var(--pribg);color:#13295e;border-radius:99px;padding:5px 5px 5px 12px;display:inline-flex;align-items:center;font-size:14px;font-weight:600}
.chip button{border:0;background:transparent;color:#13295e;cursor:pointer;font-size:18px;padding:2px 9px;opacity:.7}
.chipin{width:130px;border-radius:99px;padding:9px 13px}
.badge{font-size:11.5px;padding:3px 10px;border-radius:99px;background:var(--pribg);color:var(--pri);font-weight:700}
.badge.go{background:#e1f6e8;color:var(--ok)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* home */
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 4px;padding:18px 8px}
.tile{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;color:var(--ink);padding:0 2px}
.tile .ib{width:48px;height:48px;border-radius:14px;display:grid;place-items:center}
.tile span{font-size:11px;font-weight:600;text-align:center;line-height:1.2;color:#4b5060}
.sec{font-size:13px;color:var(--mut);font-weight:600;margin:18px 4px 8px}
.post{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.post input{flex:1;border-radius:99px;padding:11px 16px;font-size:14.5px;background:#eef0f4}
.sendb{width:42px;height:42px;border-radius:50%;border:0;background:var(--acc);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:0 5px 14px rgba(200,30,43,.38)}
.sendb svg{width:20px;height:20px}
.tl{position:relative;background:#fff;border-radius:16px;padding:14px 14px 12px 28px;margin-bottom:12px;box-shadow:var(--sh);border:1px solid #f1f2f6;display:flex;gap:12px;align-items:flex-start}
.tl::before{content:"";position:absolute;left:13px;top:15px;bottom:15px;width:3.5px;border-radius:4px;background:var(--c)}
.tlm{flex:1;min-width:0}.tlt{font-weight:700;font-size:16px}.tlb{font-size:13.5px;color:#3d4252;margin:3px 0 6px;white-space:pre-wrap;word-break:break-word}
.tlf{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap;font-size:12px}
.tli{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,#fff);flex:none}
/* shift & jadwal */
.srow{padding:11px 0;border-top:1px solid var(--line)}.srow:first-of-type{border-top:0}
.seg{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.sc,.pc{font:inherit;font-weight:700;min-width:56px;height:44px;border-radius:12px;color:var(--ink);cursor:pointer;padding:0 14px;background:var(--chip);border:1px solid var(--line)}
.sc{opacity:.6}
.sc.on,.pc.on{opacity:1;outline:2.5px solid var(--pri);outline-offset:1px}
.pal{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
tr:last-child td{border-bottom:0}
th{background:#f6f7fa;font-weight:700;font-size:11.5px;color:var(--mut)}
th.cur{color:var(--pri)}
td:first-child,th:first-child{position:sticky;left:0;background:#fff;text-align:left;z-index:1;min-width:88px}
th:first-child{background:#f6f7fa}
.cell{width:42px;height:42px;border:1.5px dashed #dfe2e9;background:transparent;color:var(--ink);border-radius:10px;cursor:pointer;font-weight:700;font-size:12.5px}
.lv{background:repeating-linear-gradient(45deg,#fff 0 6px,#f1f2f6 6px 12px);font-size:11px;color:var(--mut)}
.mini{border:1px solid var(--line);background:#fff;color:var(--pri);border-radius:8px;font-size:11.5px;font-weight:700;padding:5px 9px;cursor:pointer}
/* stat */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid #f1f2f6;border-radius:16px;padding:13px;box-shadow:var(--sh)}
.stat b{font-size:28px;display:block;line-height:1.1;color:var(--pri)}.stat span{font-size:12px;color:var(--mut);font-weight:600}
.donutw{display:flex;align-items:center;gap:16px}
.donut{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;flex:none}
.donut div{width:84px;height:84px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut b{font-size:24px;line-height:1}.donut span{font-size:11px;color:var(--mut)}
.leg{flex:1;display:grid;gap:7px;font-size:13.5px}.leg div{display:flex;align-items:center;gap:8px}.leg i{width:11px;height:11px;border-radius:4px;flex:none}.leg b{margin-left:auto}
/* employees */
.erow{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.erow>.w{grid-column:1/-1}
.eact{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between}
/* chat preview */
.bhead{font-size:12px;color:var(--mut);font-weight:700;margin:6px 0}
.chat{background:var(--bubbg) radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px) 0 0/14px 14px;border-radius:14px;padding:12px}
.bubble{background:var(--bub);color:var(--bubfg);border-radius:10px 10px 10px 2px;padding:9px 11px;white-space:pre-wrap;word-break:break-word;font-size:15px;user-select:text;box-shadow:0 1px 1px rgba(0,0,0,.13)}
.brow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
/* nav */
nav::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:24px 24px 0 0;background:linear-gradient(90deg,transparent 4%,#c81e2b 20%,#c81e2b 36%,transparent 37%)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;z-index:8;height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:linear-gradient(135deg,#27478f,#13295e);border-radius:24px 24px 0 0;box-shadow:0 -8px 26px rgba(19,41,94,.3);display:grid;grid-template-columns:1fr 1fr 92px 1fr 1fr;align-items:center}
nav>button:not(.fab){border:0;background:none;color:rgba(255,255,255,.66);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:600;padding:6px 0;cursor:pointer;position:relative}
nav>button.on{color:#fff}
nav>button.on::after{content:"";position:absolute;bottom:-1px;width:6px;height:6px;border-radius:50%;background:#ff4a58;box-shadow:0 0 8px #ff4a58}
nav svg.i{width:25px;height:25px}
.fab{position:absolute;left:50%;top:-30px;transform:translateX(-50%);width:68px;height:68px;border-radius:50%;background:#fff;border:0;color:var(--pri);display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 20px rgba(19,41,94,.4),0 0 0 5px rgba(255,255,255,.4)}
.fab svg.i{width:30px;height:30px}
nav>button.fab.on{color:var(--pri)}
nav>button.fab.on::after{display:none}
.fab.on{box-shadow:0 8px 20px rgba(19,41,94,.45),0 0 0 5px #e0636d}
#quick{display:none;position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:540px;bottom:calc(98px + env(safe-area-inset-bottom));z-index:7;gap:8px;padding:8px;background:#fff;border-radius:18px;box-shadow:0 8px 28px rgba(30,30,60,.18);border:1px solid var(--line)}
#quick.on{display:flex}#quick .btn{flex:1;min-height:46px}
#modal{position:fixed;inset:0;background:rgba(20,22,30,.5);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
#modal[hidden]{display:none}
#modal>div{background:#fff;border-radius:20px;padding:18px;max-width:340px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
#modal p{margin:0 0 12px;font-weight:600}#modal input{width:100%;margin-bottom:12px}#modal .r{display:flex;gap:8px;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:#22252e;color:#fff;padding:10px 18px;border-radius:99px;font-size:13.5px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
#toast.on{opacity:1}
.warn{background:#fff4e0;color:#7a4b00;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.empty{text-align:center;padding:26px 14px}
.empty .big{width:64px;height:64px;border-radius:50%;background:var(--pribg);color:var(--pri);display:grid;place-items:center;margin:0 auto 10px}
.empty .big svg.i{width:30px;height:30px}
</style>
</head>
<body>
<header id="top"></header>
<main><div id="warn"></div><div id="view"></div></main>
<div id="quick"></div>
<nav id="nav"></nav>
<div id="modal" hidden><div><p id="mtext"></p><input id="minput" hidden><div class="r"><button class="btn" id="mno">Batal</button><button class="btn pri" id="myes">Ya</button></div></div></div>
<div id="toast"></div>

/* ---------- penyimpanan server (db) ---------- */
const DIRTYKEY='atur-karyawan-dirty';
let DB=null,ready=false,localDirty=false,flushing=false,flushT=null,retryT=null,pendingRender=false;
const sent={main:null,days:{}};
let SYNC='load';
const SYNCLBL={load:'Memuat…',ok:'Tersimpan',saving:'Menyimpan…',err:'Offline',local:'Lokal'};
const SYNCMSG={load:'Memuat data dari server…',ok:'Data tersimpan di server, tetap ada walau ganti HP atau browser.',saving:'Sedang menyimpan ke server…',err:'Belum tersambung ke server. Data aman di perangkat ini dan akan dikirim otomatis.',local:'Penyimpanan server tidak tersedia di sini, data hanya di perangkat ini.'};
const st=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
const mainBody=()=>{const m={};Object.keys(S).forEach(k=>{if(k!=='days')m[k]=S[k]});return m};
const isBlank=d=>!Object.keys(d.shift||{}).length&&!(d.areas||[]).length&&!(d.piket||[]).length&&!(d.driver||[]).length&&!String(d.nasi||'').trim();
const syncHTML=dot=>`<button class="sync s-${SYNC}${dot?' dot':''}" data-sync ${dot?'data-dot="1"':''} data-act="syncinfo" aria-label="Status penyimpanan"><i></i><b>${SYNCLBL[SYNC]}</b></button>`;
function paintSync(){document.querySelectorAll('[data-sync]').forEach(el=>{el.className='sync s-'+SYNC+(el.dataset.dot?' dot':'');el.querySelector('b').textContent=SYNCLBL[SYNC]})}
function setSync(x){SYNC=x;paintSync()}
function schedFlush(){if(!DB||!ready)return;clearTimeout(flushT);flushT=setTimeout(flush,700)}
async function flush(){
  if(!DB||!ready||flushing)return;
  flushing=true;let clean=false;
  try{
    for(let g=0;g<20;g++){
      const ops=[];
      const mj=st(mainBody());
      if(mj!==sent.main)ops.push({p:'app/main',b:JSON.parse(mj),ok:()=>{sent.main=mj}});
      new Set([...Object.keys(S.days),...Object.keys(sent.days)]).forEach(k=>{
        const d=S.days[k],live=d&&!isBlank(d),j=live?st(d):null;
        if(j!==(sent.days[k]||null)){
          if(live)ops.push({p:'days/'+k,b:JSON.parse(j),ok:()=>{sent.days[k]=j}});
          else ops.push({p:'days/'+k,del:1,ok:()=>{delete sent.days[k]}});
        }});
      if(!ops.length){clean=true;break}
      setSync('saving');
      for(const o of ops){const r=DB.doc(o.p);if(o.del)await r.delete();else await r.set(o.b);o.ok()}
    }
    if(clean){localDirty=false;try{localStorage.removeItem(DIRTYKEY)}catch(e){}setSync('ok')}
  }catch(e){
    const c=e&&e.code;setSync('err');
    if(['invalid_argument','quota_exceeded','revoked'].includes(c))toast(c==='quota_exceeded'?'Penyimpanan server penuh':'Server menolak penyimpanan ('+c+')');
    else{clearTimeout(retryT);retryT=setTimeout(flush,10000)}
  }finally{flushing=false}
  if(clean&&localDirty)schedFlush();
}
function softRender(){const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){pendingRender=true;return}render()}
document.addEventListener('focusout',()=>{if(pendingRender){pendingRender=false;setTimeout(render,250)}});
function cacheLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
async function initDB(){
  if(typeof claude==='undefined'||!claude||!claude.use){setSync('local');return}
  let db=null;try{db=await claude.use('db')}catch(e){}
  if(!db){setSync('local');return}
  DB=db;setSync('load');
  const to=setTimeout(()=>{if(!ready)setSync('err')},10000);
  try{
    const [ms,ds]=await Promise.all([DB.doc('app/main').get(),DB.collection('days').get()]);
    clearTimeout(to);
    const srvDays={};ds.docs.forEach(d=>{srvDays[d.id]=d.data()});
    let dirty=false;try{dirty=localStorage.getItem(DIRTYKEY)==='1'}catch(e){}
    const hasLocal=S.emps.length||Object.values(S.days).some(d=>!isBlank(d))||S.ann.length||S.leaves.length;
    if(ms.exists&&!dirty){
      S=norm(Object.assign({},JSON.parse(JSON.stringify(ms.data())),{days:srvDays}));
      sent.main=st(mainBody());Object.keys(S.days).forEach(k=>{sent.days[k]=st(S.days[k])});
      cacheLocal();try{localStorage.removeItem(DIRTYKEY)}catch(e){}
      localDirty=false;
    }else{
      if(ms.exists)S.days=Object.assign({},srvDays,S.days);   // lokal belum terkirim: menang, hari lain dari server digabung
      Object.keys(srvDays).forEach(k=>{if(S.days[k]===srvDays[k])sent.days[k]=st(srvDays[k])});
      if(ms.exists&&!dirty)sent.main=st(mainBody());
      if(hasLocal||dirty)localDirty=true;
    }
    ready=true;
    setSync('ok');render();
    DB.doc('app/main').onSnapshot(snap=>{
      if(!snap.exists||snap.metadata.hasPendingWrites||localDirty||flushing)return;
      const body=JSON.parse(JSON.stringify(snap.data()));
      const cur=st(mainBody());
      const next=norm(Object.assign({},body,{days:S.days}));
      if(st((()=>{const m={};Object.keys(next).forEach(k=>{if(k!=='days')m[k]=next[k]});return m})())===cur)return;
      S=next;sent.main=st(mainBody());cacheLocal();softRender();
    },()=>setSync('err'));
    DB.collection('days').onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites||localDirty||flushing)return;
      let ch=false;
      snap.docChanges().forEach(c=>{
        const id=c.doc.id;
        if(c.type==='removed'){if(S.days[id]){delete S.days[id];delete sent.days[id];ch=true}return}
        const d=JSON.parse(JSON.stringify(c.doc.data()));
        if(!S.days[id]||st(S.days[id])!==st(d)){S.days[id]=d;sent.days[id]=st(d);ch=true}
      });
      if(ch){cacheLocal();softRender()}
    },()=>setSync('err'));
    if(localDirty)flush();
  }catch(e){clearTimeout(to);setSync('err');ready=false;DB=null;setTimeout(initDB,15000);if(localDirty)localDirty=true}
}

const initials=n=>(String(n||'A').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('')||'A').toUpperCase();

const cap=s=>s.replace(/(^|[\s.\-])([a-z])/g,(m,a,b)=>a+b.toUpperCase());
const BAR='━━━━━━━━━━━━━━━';
function msg1(date){
  const d=D(date),L=leavesOn(date),onL=new Set(L.map(l=>l.emp));
  const sh=S.emps.filter(e=>e.aktif&&d.shift[e.id]&&!onL.has(e.id));
  const nasi=String(d.nasi).trim(),lines=[];
  if(S.gaya==='polos'){
    lines.push(longDate(date),'');
    L.forEach(l=>{lines.push(who(emp(l.emp))+' ( '+l.jenis+' ');lines.push(fmtDMY(l.start)+' – '+fmtDMY(l.end)+' )')});
    if(L.length)lines.push('');
    if(sh.length){lines.push(S.label+' :');sh.forEach(e=>lines.push(who(e)+' ('+d.shift[e.id]+')'));lines.push('')}
    if(nasi!=='')lines.push('Nasi siang : '+nasi);
    return lines.join('\n').trim();
  }
  lines.push('📋 *'+(S.judul||'LAPORAN HARIAN SHIFT')+'*','🗓️ *'+longDate(date)+'*',BAR,'');
  if(L.length){lines.push('🌴 *CUTI / IZIN*');L.forEach(l=>{lines.push('• '+emp(l.emp).nama+nikOf(emp(l.emp)));lines.push('   ↳ '+l.jenis+' · '+fmtDMY(l.start)+' – '+fmtDMY(l.end))});lines.push('')}
  if(sh.length){lines.push('⏰ *'+S.label+'*');sh.forEach(e=>{const c=d.shift[e.id];lines.push((isOff(c)?'😴 ':'✅ ')+e.nama+nikOf(e)+' — *'+c+'*')});lines.push('')}
  if(nasi!=='')lines.push('🍱 *Nasi siang:* '+nasi+' porsi');
  return lines.join('\n').trim();
}
function msg2(date){
  const d=D(date),p=[];
  const A=d.areas.filter(a=>a.kode||a.names.length);
  if(!(A.length||d.piket.length||d.driver.length))return '';
  if(S.gaya==='polos'){
    p.push('Pembagian Area Kerja','');
    A.forEach(a=>{p.push((a.kode||'-')+' | '+a.names.join(', '));p.push('')});
    if(d.piket.length)p.push('Piket | '+d.piket.join(', '));
    if(d.driver.length)p.push('Driver | '+d.driver.join(', '));
    return p.join('\n').trim();
  }
  const nm=a=>a.map(cap).join(', ');
  p.push('📍 *PEMBAGIAN AREA KERJA*','🗓️ '+longDate(date),BAR,'');
  A.forEach(a=>p.push('🔧 *'+(a.kode||'-')+'* ▸ '+nm(a.names)));
  if(A.length&&(d.piket.length||d.driver.length))p.push('');
  if(d.piket.length)p.push('🛡️ *Piket* ▸ '+nm(d.piket));
  if(d.driver.length)p.push('🚗 *Driver* ▸ '+nm(d.driver));
  return p.join('\n').trim();
}
const autoPgl=n=>{const w=n.trim().split(/\s+/);const f=w.find(x=>!/^(muh|muhammad|moh|mohammad|mhd|m|md)\.?$/i.test(x));return (f||w[0]||'').replace(/[.,]/g,'').toLowerCase()};
function parseBulk(txt){
  return txt.split(/\r?\n/).map(l=>l.trim().replace(/^\d{1,3}[.)]\s+/,'')).filter(Boolean).map(l=>{
    let nama,nik='',pgl='';
    if(/[,;|\t]/.test(l)){const p=l.split(/[,;|\t]/).map(x=>x.trim());nama=p[0];
      if(p[1]&&!/^\d+$/.test(p[1])){pgl=p[1];nik=(p[2]||'').replace(/\s/g,'')}else{nik=(p[1]||'').replace(/\s/g,'');pgl=p[2]||''}}
    else{const m=l.match(/^(.*?)\s+(\d{5,})$/);if(m){nama=m[1];nik=m[2]}else nama=l}
    nama=(nama||'').trim();return {nama,nik,pgl:(pgl||autoPgl(nama)).toLowerCase()}
  }).filter(x=>x.nama)
}

  const d=D(UI.date),onL=new Set(leavesOn(UI.date).map(l=>l.emp));

function weekStart(s){const d=parse(s),g=d.getDay();return addDays(s,g===0?-6:1-g)}
function vJadwal(){
  if(!S.emps.length)return needEmp();
  const mon=weekStart(UI.date),days=[...Array(7)].map((_,i)=>addDays(mon,i)),act=S.emps.filter(e=>e.aktif);
  const pal=S.codes.map(c=>`<button class="pc ${UI.brush===c?'on':''}" style="${cstyle(c)}" data-act="brush" data-c="${esc(c)}">${esc(c)}</button>`).join('')+`<button class="pc ${UI.brush===''?'on':''}" data-act="brush" data-c="">Hapus</button>`;
  const rows=act.map(e=>{
    const tds=days.map(dt=>{
      const lv=S.leaves.find(l=>l.emp===e.id&&l.start<=dt&&dt<=l.end);
      if(lv)return `<td class="lv" title="${esc(lv.jenis)}">${esc(lv.jenis.slice(0,7))}</td>`;
      const c=D(dt).shift[e.id]||'';
      return `<td><button class="cell" data-act="cell" data-e="${e.id}" data-d="${dt}" style="${c?cstyle(c):''}">${esc(c)}</button></td>`;
    }).join('');
    return `<tr><td><b>${esc(e.nama)}</b></td>${tds}<td><button class="mini" data-act="fillrow" data-e="${e.id}">Isi</button></td></tr>`;
  }).join('');
  const th=days.map(dt=>{const d=parse(dt);return `<th class="${dt===UI.date?'cur':''}">${HSH[d.getDay()]}<br>${d.getDate()}/${d.getMonth()+1}</th>`}).join('');
  return `<section class="card"><div class="h"><h3>Minggu ini</h3><span class="badge">${fmtDMY(days[0])} – ${fmtDMY(days[6])}</span></div>

   <div class="pal">${pal}</div>
   <div class="tw"><table><thead><tr><th>Nama</th>${th}<th></th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

  <section class="card"><h3>Tambah satu karyawan</h3><div class="g2" style="margin-top:10px"><input id="ne-nama" placeholder="Nama"><input id="ne-pgl" placeholder="Panggilan"><input id="ne-nik" placeholder="NIK" inputmode="numeric"><button class="btn pri" data-act="addemp">Tambah</button></div></section>
  <section class="card"><div class="h"><h3>Daftar karyawan</h3><span class="mut sm">${S.emps.length} orang</span></div>${rows||'<p class="mut">Belum ada.</p>'}<p class="mut sm" style="margin-bottom:0">Urutan di sini menentukan urutan di pesan WA. “Panggilan” dipakai di pembagian area.</p></section>
  <section class="card"><h3>Kode shift</h3><p class="mut sm" style="margin:4px 0 10px">Kode yang muncul di pilihan shift. Kode <b>OFF</b> tidak dihitung sebagai nasi siang.</p>
   <div class="chips">${S.codes.map((c,i)=>`<span class="chip" style="${cstyle(c)}">${esc(c)}<button data-act="delcode" data-i="${i}">×</button></span>`).join('')}<input class="chipin" placeholder="+ kode" data-bind="addcode"></div></section>
  <section class="card" id="sec-backup"><h3>Cadangan data</h3><p class="mut sm" style="margin:4px 0 10px">Data tersimpan di browser ini saja. Salin cadangan untuk pindah perangkat.</p>
   <button class="btn" data-act="backup">Salin cadangan</button>

   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="restore">Pulihkan</button><button class="btn danger" data-act="wipe">Kosongkan semua</button></div></section>`;

const JENIS=['CFV+CT','Cuti Tahunan','Cuti Sakit','Izin','Cuti Khusus','Cuti Hamil'];
function vCuti(){
  if(!S.emps.length)return needEmp();
  if(!UI.cf)UI.cf={id:'',emp:(S.emps[0]||{}).id||'',jenis:'Cuti Tahunan',start:UI.date,end:UI.date};
  const f=UI.cf,t=ymd(new Date());
  const used=[...new Set(JENIS.concat(S.leaves.map(l=>l.jenis)))];
  const list=S.leaves.slice().sort((a,b)=>b.start.localeCompare(a.start)).map(l=>{const e=emp(l.emp);const st=l.end<t?['Selesai','']:l.start>t?['Akan datang','']:['Berlangsung','go'];
    return `<div class="row"><div class="grow"><b>${esc(e?e.nama:'(dihapus)')}</b> <span class="badge ${st[1]}">${st[0]}</span><div class="mut sm">${esc(l.jenis)} · ${fmtDMY(l.start)} – ${fmtDMY(l.end)}</div></div><button class="btn sm" data-act="editleave" data-id="${l.id}">Ubah</button><button class="x" data-act="delleave" data-id="${l.id}" aria-label="Hapus">🗑</button></div>`}).join('');
  return `<section class="card"><h3>${f.id?'Ubah':'Tambah'} cuti / izin</h3><div style="margin-top:10px">
   <label class="fld">Karyawan<select data-bind="cf" data-f="emp">${S.emps.map(e=>`<option value="${e.id}" ${e.id===f.emp?'selected':''}>${esc(e.nama)}</option>`).join('')}</select></label>
   <label class="fld">Jenis<input data-bind="cf" data-f="jenis" list="jl" value="${esc(f.jenis)}"><datalist id="jl">${used.map(j=>`<option value="${esc(j)}">`).join('')}</datalist></label>
   <div class="g2"><label class="fld">Mulai<input type="date" data-bind="cf" data-f="start" value="${f.start}"></label><label class="fld">Selesai<input type="date" data-bind="cf" data-f="end" value="${f.end}"></label></div>
   <div style="display:flex;gap:8px"><button class="btn pri" data-act="savecuti">Simpan</button>${f.id?'<button class="btn" data-act="resetcf">Batal</button>':''}</div></div></section>
   <section class="card"><div class="h"><h3>Daftar cuti & izin</h3><span class="mut sm">${S.leaves.length}</span></div>${list||'<p class="mut">Belum ada pengajuan.</p>'}</section>`;
}
function vStat(){
  if(!S.emps.length)return needEmp();
  const dt=parse(UI.date),y=dt.getFullYear(),m=dt.getMonth(),n=new Date(y,m+1,0).getDate();
  const dates=[...Array(n)].map((_,i)=>y+'-'+pad(m+1)+'-'+pad(i+1));
  const act=S.emps.filter(e=>e.aktif),d=D(UI.date),onL=new Set(leavesOn(UI.date).map(l=>l.emp));
  const counts={};let sched=0;
  act.forEach(e=>{if(onL.has(e.id))return;const c=d.shift[e.id];if(c){counts[c]=(counts[c]||0)+1;sched++}});
  const free=Math.max(0,act.length-sched-onL.size);
  const codes=[...new Set(S.codes.concat(Object.keys(counts)))];
  const segs=codes.map(c=>[c,counts[c]||0,`hsl(${hue(c)} 65% 58%)`]).concat([['Cuti/izin',onL.size,'#5bb6e6'],['Belum diatur',free,'#d7dbe3']]).filter(x=>x[1]>0);
  const tot=segs.reduce((a,x)=>a+x[1],0);let acc=0;
  const stops=segs.map(x=>{const a=acc/tot*360;acc+=x[1];return `${x[2]} ${a}deg ${acc/tot*360}deg`}).join(',');
  const mc=new Set();dates.forEach(dd=>Object.values(D(dd).shift).forEach(c=>c&&mc.add(c)));
  const mcodes=[...new Set(S.codes.concat([...mc]))];
  const trs=act.map(e=>{
    const cs=mcodes.map(c=>dates.filter(dd=>D(dd).shift[e.id]===c&&!S.leaves.some(l=>l.emp===e.id&&l.start<=dd&&dd<=l.end)).length);
    const cuti=dates.filter(dd=>S.leaves.some(l=>l.emp===e.id&&l.start<=dd&&dd<=l.end)).length;
    return `<tr><td><b>${esc(e.nama)}</b></td>${cs.map(v=>`<td>${v||'·'}</td>`).join('')}<td>${cuti||'·'}</td></tr>`}).join('');
  return `<div class="stats"><div class="stat"><b>${act.length}</b><span>Karyawan aktif</span></div><div class="stat"><b>${sched}</b><span>Terjadwal</span></div><div class="stat"><b>${onL.size}</b><span>Cuti / izin</span></div><div class="stat"><b>${free}</b><span>Belum diatur</span></div></div>
  <section class="card"><div class="h"><h3>Sebaran shift</h3><span class="badge">${esc(longDate(UI.date))}</span></div>
   <div class="donutw"><div class="donut" style="background:${tot?`conic-gradient(${stops})`:'#eceef3'}"><div><b>${tot}</b><span>orang</span></div></div><div class="leg">${segs.map(x=>`<div><i style="background:${x[2]}"></i>${esc(x[0])}<b>${x[1]}</b></div>`).join('')||'<span class="mut">Belum ada data.</span>'}</div></div></section>
  <section class="card"><div class="h"><h3>Rekap ${BULAN[m]} ${y}</h3><span class="mut sm">jumlah hari</span></div><div class="tw"><table><thead><tr><th>Nama</th>${mcodes.map(c=>`<th>${esc(c)}</th>`).join('')}<th>Cuti</th></tr></thead><tbody>${trs}</tbody></table></div></section>`;
}

/* ---------- render ---------- */
$('#nav').innerHTML=`<button data-act="tab" data-v="home">${ic('home')}<span>Beranda</span></button><button data-act="tab" data-v="jadwal">${ic('cal')}<span>Jadwal</span></button><span></span><button data-act="tab" data-v="cuti">${ic('doc')}<span>Cuti</span></button><button data-act="tab" data-v="emp">${ic('user')}<span>Karyawan</span></button><button class="fab" data-act="tab" data-v="pesan" aria-label="Pesan WhatsApp">${ic('send')}</button>`;
function render(){
  const y0=window.scrollY,t=UI.tab;
  const hd=$('#top');hd.className=t==='home'?'home':'';
  hd.innerHTML=t==='home'
    ?`<div class="brandrow"><img class="logo" src="${LOGO}" alt="PT Sulawesi Recycling Technology">${syncHTML(false)}</div><div class="hello"><div><h1>Halo!!</h1><button class="nm" data-act="rename">${esc(S.nama||'Admin')}<small>✎</small></button></div><div class="avatar">${esc(initials(S.nama))}</div></div>`
    :`<div class="bar"><button class="back" data-act="tab" data-v="home" aria-label="Kembali">‹</button><h2>${TITLE[t]}</h2>${syncHTML(true)}<img class="logo2" src="${LOGO}" alt=""></div>`+(['pesan','jadwal','stat'].includes(t)?`<div id="datebar"><button class="btn sm" data-act="prev" aria-label="Sebelumnya">‹</button><input type="date" id="dpick" value="${UI.date}"><button class="btn sm" data-act="next" aria-label="Berikutnya">›</button><button class="btn sm" data-act="today">Hari ini</button></div>`:'');
  document.querySelectorAll('#nav [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===t));
  $('#view').innerHTML=({home:vHome,pesan:vPesan,jadwal:vJadwal,emp:vEmp,cuti:vCuti,stat:vStat})[t]();
  if(t==='pesan')refreshOutput();
  const q=t==='pesan'&&S.emps.length>0;$('#quick').classList.toggle('on',q);document.body.classList.toggle('q',q);
  warn();
  window.scrollTo(0,y0);
  if(UI.focus){const el=document.querySelector(`.chipin[data-t="${UI.focus}"]`);if(el)el.focus();UI.focus=null}
}

/* ---------- events ---------- */
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,ds=b.dataset;
  if(a==='tab'){UI.tab=ds.v;UI.cf=null;render();window.scrollTo(0,0)}
  else if(a==='go'){UI.tab=ds.v;UI.cf=null;render();window.scrollTo(0,0);if(ds.s){const el=document.getElementById(ds.s)||document.getElementById('sec-'+ds.s);if(el){el.scrollIntoView({behavior:'smooth',block:'start'});if(/INPUT|TEXTAREA/.test(el.tagName))setTimeout(()=>el.focus({preventScroll:true}),350)}}}
  else if(a==='syncinfo'){toast(SYNCMSG[SYNC]);if(SYNC==='err'){if(DB&&ready)flush();else if(!DB)initDB()}}
  else if(a==='rename'){const v=await askText('Nama yang tampil di sapaan',S.nama);if(v!==null){S.nama=v.trim()||'Admin';save();render()}}
  else if(a==='postann'){const i=$('#annin'),t=i.value.trim();if(!t){i.focus();return}S.ann.push({id:uid(),text:t,ts:Date.now()});save();render();toast('Pengumuman diposting ✓')}
  else if(a==='delann'){if(await ask('Hapus pengumuman ini?','Hapus')){S.ann=S.ann.filter(x=>x.id!==ds.id);save();render()}}
  else if(a==='prev'||a==='next'){UI.date=addDays(UI.date,(a==='next'?1:-1)*(UI.tab==='jadwal'?7:1));render()}
  else if(a==='today'){UI.date=ymd(new Date());render()}
  else if(a==='copy'){toast(await copyText(MSG[ds.m]())?'Pesan disalin ✓':'Gagal menyalin, tekan lama pada teks')}
  else if(a==='copyall'){const t=[msg1(UI.date),msg2(UI.date)].filter(Boolean).join('\n\n');toast(await copyText(t)?'Kedua pesan disalin ✓':'Gagal menyalin')}
  else if(a==='usesug'){W(UI.date).nasi=String(suggest());save();render()}
  else if(a==='addarea'){W(UI.date).areas.push({kode:'',names:[]});save();render()}
  else if(a==='rmarea'){if(await ask('Hapus area ini?','Hapus')){W(UI.date).areas.splice(+ds.i,1);save();render()}}
  else if(a==='rmchip'){listOf(W(UI.date),ds.t).splice(+ds.i,1);save();render()}
  else if(a==='copyprev'){
    const w=W(UI.date),p=D(addDays(UI.date,-1));
    if((Object.keys(w.shift).length||w.areas.length)&&!await ask('Timpa data hari ini dengan data kemarin?','Timpa'))return;
    w.shift=clone(p.shift);w.areas=clone(p.areas);w.piket=clone(p.piket);w.driver=clone(p.driver);save();render();toast('Disalin dari kemarin')}
  else if(a==='setshift'){const w=W(UI.date);if(w.shift[ds.e]===ds.c)delete w.shift[ds.e];else w.shift[ds.e]=ds.c;save();render()}
  else if(a==='brush'){UI.brush=ds.c;render()}
  else if(a==='cell'){
    const w=W(ds.d);if(UI.brush===''||w.shift[ds.e]===UI.brush)delete w.shift[ds.e];else w.shift[ds.e]=UI.brush;save();
    const c=w.shift[ds.e]||'';b.textContent=c;b.style.cssText=c?cstyle(c):''}
  else if(a==='fillrow'){
    const mon=weekStart(UI.date);for(let i=0;i<7;i++){const dt=addDays(mon,i);if(S.leaves.some(l=>l.emp===ds.e&&l.start<=dt&&dt<=l.end))continue;const w=W(dt);if(UI.brush==='')delete w.shift[ds.e];else w.shift[ds.e]=UI.brush}save();render()}
  else if(a==='mv'){const i=S.emps.findIndex(e=>e.id===ds.e),j=i+ +ds.n;if(j>=0&&j<S.emps.length){[S.emps[i],S.emps[j]]=[S.emps[j],S.emps[i]];save();render()}}
  else if(a==='delemp'){const e=emp(ds.e);if(await ask('Hapus '+e.nama+'? Cuti dan jadwalnya ikut terhapus.','Hapus')){S.emps=S.emps.filter(x=>x.id!==e.id);S.leaves=S.leaves.filter(l=>l.emp!==e.id);Object.values(S.days).forEach(d=>delete d.shift[e.id]);save();render()}}
  else if(a==='addemp'){const nama=$('#ne-nama').value.trim();if(!nama){toast('Isi nama dulu');return}S.emps.push({id:uid(),nama,pgl:($('#ne-pgl').value.trim()||autoPgl(nama)).toLowerCase(),nik:$('#ne-nik').value.trim(),aktif:true});save();render();toast('Karyawan ditambahkan')}
  else if(a==='bulkadd'){
    const list=parseBulk($('#bulk').value);if(!list.length){toast('Belum ada nama untuk ditambahkan');return}
    const have=new Set(S.emps.map(e=>e.nama.toLowerCase()));let add=0,skip=0;
    list.forEach(x=>{if(have.has(x.nama.toLowerCase())){skip++;return}have.add(x.nama.toLowerCase());S.emps.push({id:uid(),nama:x.nama,pgl:x.pgl,nik:x.nik,aktif:true});add++});
    save();render();toast(add+' karyawan ditambahkan'+(skip?' · '+skip+' dilewati (sudah ada)':''))}
  else if(a==='delcode'){S.codes.splice(+ds.i,1);save();render()}
  else if(a==='savecuti'){
    const f=UI.cf;if(!f.emp||!f.jenis.trim()||!f.start||!f.end){toast('Lengkapi data dulu');return}
    if(f.end<f.start){toast('Tanggal selesai harus setelah mulai');return}
    if(f.id){Object.assign(S.leaves.find(l=>l.id===f.id),{emp:f.emp,jenis:f.jenis.trim(),start:f.start,end:f.end})}else S.leaves.push({id:uid(),emp:f.emp,jenis:f.jenis.trim(),start:f.start,end:f.end});
    UI.cf=null;save();render();toast('Tersimpan ✓')}
  else if(a==='editleave'){UI.cf=clone(S.leaves.find(l=>l.id===ds.id));render();window.scrollTo(0,0)}
  else if(a==='resetcf'){UI.cf=null;render()}
  else if(a==='delleave'){if(await ask('Hapus pengajuan ini?','Hapus')){S.leaves=S.leaves.filter(l=>l.id!==ds.id);save();render()}}
  else if(a==='backup'){toast(await copyText(JSON.stringify(S))?'Cadangan disalin ✓':'Gagal menyalin')}
  else if(a==='restore'){try{const o=norm(JSON.parse($('#rest').value));if(!o)throw 0;if(await ask('Ganti semua data dengan cadangan ini?','Pulihkan')){S=o;save();render();toast('Data dipulihkan ✓')}}catch(e){toast('Teks cadangan tidak valid')}}
  else if(a==='wipe'){if(await ask('Hapus SEMUA data karyawan, jadwal, dan cuti?','Hapus semua')){const n=S.nama;S=empty();S.nama=n;save();render()}}
});
document.addEventListener('input',ev=>{
  const t=ev.target,b=t.dataset.bind;if(!b)return;
  if(b==='kode'){W(UI.date).areas[+t.dataset.i].kode=t.value;save();refreshOutput()}
  else if(b==='label'){S.label=t.value;save();refreshOutput()}
  else if(b==='nasi'){W(UI.date).nasi=t.value;save();refreshOutput()}
  else if(b==='emp'){emp(t.dataset.e)[t.dataset.f]=t.value;save()}
  else if(b==='cf'){UI.cf[t.dataset.f]=t.value}
  else if(b==='judul'){S.judul=t.value;save();refreshOutput()}
  else if(b==='bulk'){$('#bulkinfo').textContent=parseBulk(t.value).length+' nama terdeteksi'}
});
document.addEventListener('change',ev=>{
  const t=ev.target,b=t.dataset.bind;
  if(t.id==='dpick'){if(t.value){UI.date=t.value;render()}return}
  if(!b)return;
  if(b==='gaya'){S.gaya=t.value;save();refreshOutput()}
  else if(b==='aktif'){emp(t.dataset.e).aktif=t.checked;save();render()}
  else if(b==='addchip'){const v=t.value.split(',').map(x=>x.trim()).filter(Boolean);if(!v.length)return;listOf(W(UI.date),t.dataset.t).push(...v);save();UI.focus=t.dataset.t;render()}
  else if(b==='addcode'){const v=t.value.trim();if(v&&!S.codes.includes(v)){S.codes.push(v);save();render()}}
});
document.addEventListener('keydown',ev=>{
  const t=ev.target;
  if(ev.key==='Enter'&&t.dataset&&['addchip','addcode'].includes(t.dataset.bind))t.blur();
  if(ev.key==='Enter'&&t.id==='annin'){ev.preventDefault();document.querySelector('[data-act=postann]').click()}
});
render();
initDB();
</script>
</body>
</html>
