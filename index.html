function zhWord(w){
  let s=String(w).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,'');
  if(!s)return '';
  if(ZH_DICT[s])return ZH_DICT[s];
  s=s.replace(/oe/g,'u').replace(/dj/g,'j').replace(/tj/g,'c').replace(/ch/g,'kh').replace(/ph/g,'f').replace(/q/g,'k').replace(/x/g,'ks');
  const isV=t=>t.length===1&&'aiueo'.includes(t);
  const T=[];for(let i=0;i<s.length;){const two=s.slice(i,i+2);if(two==='ng'||two==='ny'||two==='sy'||two==='kh'){T.push(two);i+=2}else{T.push(s[i]);i++}}
  for(let i=0;i<T.length;i++)if(T[i]==='y'&&i>0&&!isV(T[i-1])&&!(i+1<T.length&&isV(T[i+1])))T[i]='i';
  const U=[];T.forEach(t=>{if(!isV(t)&&U.length&&U[U.length-1]===t)return;U.push(t)});
  let out='',i=0;
  while(i<U.length){
    let on='';
    if(!isV(U[i])){if(i+1<U.length&&isV(U[i+1])){on=U[i];i++}else{out+=ZF[U[i]]||'';i++;continue}}
    const v=U[i];i++;const row=ZT[on]||ZT[''];
    if(v==='a'&&U[i]==='i'&&!(i+1<U.length&&isV(U[i+1]))){out+=ZAI[on]||row[0]+'伊';i++;continue}
    if(v==='a'&&U[i]==='u'&&!(i+1<U.length&&isV(U[i+1]))){out+=row[0]+'乌';i++;continue}
    const nx=U[i],nn=U[i+1];
    if(nx&&!isV(nx)&&(nn===undefined||!isV(nn))){
      if(nx==='n'){out+=(ZN[on]||ZN[''])[ZV[v]];i++;continue}
      if(nx==='ng'){out+=v==='a'?(ZNG[on]||'昂'):(ZN[on]||ZN[''])[ZV[v]];i++;continue}
      out+=row[ZV[v]]+(ZF[nx]||'');i++;continue;
    }
    out+=row[ZV[v]];
  }
  return out;
}
const hasCJK=s=>/[㐀-鿿]/.test(String(s||''));
function zhName(n){n=String(n||'').trim();if(!n||hasCJK(n))return n;return n.split(/[\s\-]+/).map(zhWord).filter(Boolean).join('·')}

function TR(k){if(Object.prototype.hasOwnProperty.call(ZH,k))return ZH[k];for(const [re,to] of ZHRX){if(re.test(k))return k.replace(re,to)}return k}
const Z=t=>LANG==='zh'&&t!=null?TR(String(t)):t;
const T=t=>{if(t==null||LANG==='id')return t;const s0=String(t),r=TR(s0);if(LANG==='zh'||r===s0)return r;if(hasCJK(s0))return s0;const z=dualZh(s0,r);return s0.length>34?s0+'\n'+z:s0+' · '+z};
const bil=t=>{const r=TR(t);return LANG==='zh'?esc(r):LANG==='dual'&&r!==t&&!hasCJK(t)?esc(t)+'<small class="zhs">'+esc(dualZh(t,r))+'</small>':esc(t)};
const DUALSKIP=/^\d+(\/\d+)? (orang|karyawan|nama terdeteksi)$/;
const dualZh=(k,r)=>{const m=k.match(/^(\S+\s)/);if(m&&!/[A-Za-z0-9]/.test(m[1])&&r.startsWith(m[1]))return r.slice(m[1].length);return r};
function trDom(root){
  if(LANG==='id'||!root)return;
  const dual=LANG==='dual';
  root.querySelectorAll('[data-zhk]').forEach(el=>{const h=ZHP[el.getAttribute('data-zhk')];if(h==null)return;
    if(!dual){el.innerHTML=h;return}
    const nx=el.nextElementSibling;if(nx&&nx.classList.contains('zh2b'))return;
    const tag=el.tagName==='OL'?'ol':'div';
    el.insertAdjacentHTML('afterend','<'+tag+' class="zh2b'+(tag==='ol'?' steps':'')+'" data-nt>'+h.replace(/id="qrleft"/g,'class="qrleft"')+'</'+tag+'>')});
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const pe=n.parentElement;if(!pe||pe.closest('[data-nt],.bubble,script,style,textarea,code,.zh2,.zh2b,.zhs'))return NodeFilter.FILTER_REJECT;return n.nodeValue.trim()?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
  const list=[];while(w.nextNode())list.push(w.currentNode);
  list.forEach(n=>{const v=n.nodeValue,k=v.trim(),r=TR(k);if(r===k)return;
    if(!dual){n.nodeValue=v.replace(k,r);return}
    if(DUALSKIP.test(k)||hasCJK(k))return;
    const pe=n.parentElement,z=dualZh(k,r);
    if(k.length>30&&!['OPTION','BUTTON','A','B','SPAN'].includes(pe.tagName)){const sp=document.createElement('span');sp.className='zh2';sp.textContent=z;pe.insertBefore(sp,n.nextSibling)}
    else n.nodeValue=v.replace(k,k+(pe.closest('h2,h3,h4,.sec,.bhead,.tlt')?' · ':' ')+z);
  });
  root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(el=>{if(el.closest('[data-nt]'))return;['placeholder','aria-label','title'].forEach(a=>{const v=el.getAttribute(a);if(!v)return;const k=v.trim(),r=TR(k);if(r===k)return;
    if(!dual)el.setAttribute(a,r);else if(!hasCJK(k)&&(a!=='placeholder'||k.length<=18))el.setAttribute(a,k+' · '+dualZh(k,r))})});
}

const DIRTYKEY='atur-karyawan-dirty';
let BACK='local',DB=null,ready=false,localDirty=false,flushing=false,flushT=null,retryT=null,pendingRender=false;
const sent={main:null,days:{}};
let SYNC='load';
const SYNCLBL={load:'Memuat…',ok:'Tersimpan',saving:'Menyimpan…',err:'Offline',local:'Lokal'};
const where=()=>BACK==='gh'&&GHC?'repo GitHub '+GHC.owner+'/'+GHC.repo:'server claude.ai';
const whereZh=w=>w.replace(/^repo GitHub (.+)$/,'GitHub 仓库 $1').replace('server claude.ai','claude.ai 服务器');
const SYNCMSG=()=>({load:'Memuat data dari '+where()+'…',ok:'Data tersimpan di '+where()+', tetap ada walau ganti HP atau browser.',saving:'Sedang menyimpan ke '+where()+'…',err:SYNCERR||('Belum tersambung ke '+where()+'. Data aman di perangkat ini dan akan dikirim otomatis.'),local:'Data hanya tersimpan di perangkat ini. Hubungkan server di menu Penyimpanan.'})[SYNC];
let SYNCERR='';
const st=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
const mainBody=()=>{const m={};Object.keys(S).forEach(k=>{if(k!=='days')m[k]=S[k]});return m};
const isBlank=d=>!Object.keys(d.shift||{}).length&&!(d.areas||[]).length&&!(d.piket||[]).length&&!(d.driver||[]).length&&!String(d.nasi||'').trim();
const syncHTML=dot=>`<button class="sync s-${SYNC}${dot?' dot':''}" data-sync ${dot?'data-dot="1"':''} data-act="syncinfo" aria-label="Status penyimpanan"><i></i><b>${T(SYNCLBL[SYNC])}</b></button>`;
function paintSync(){document.querySelectorAll('[data-sync]').forEach(el=>{el.className='sync s-'+SYNC+(el.dataset.dot?' dot':'');el.querySelector('b').textContent=T(SYNCLBL[SYNC])})}
function setSync(x,msg){SYNC=x;SYNCERR=x==='err'?(msg||''):'';paintSync();const sv=$('#srvstat');if(sv)sv.textContent=T(SYNCMSG())}
function schedFlush(){if(BACK==='local'||!ready)return;clearTimeout(flushT);flushT=setTimeout(flush,BACK==='gh'?3000:700)}
function flush(){return BACK==='gh'?flushGH():BACK==='db'?flushDB():null}
async function flushDB(){
  if(BACK!=='db'||!DB||!ready||flushing)return;
  flushing=true;let clean=false;
  try{
    for(let g=0;g<20;g++){
      const ops=[];
      const mj=st(mainBody());
      if(mj!==sent.main)ops.push({p:'app/main',b:JSON.parse(mj),ok:()=>{sent.main=mj}});
      new Set([...Object.keys(S.days),...Object.keys(sent.days)]).forEach(k=>{
        const d=S.days[k],live=d&&!isBlank(d),j=live?st(d):null;
        if(j!==(sent.days[k]||null)){
          if(live)ops.push({p:'days/'+k,b:JSON.parse(j),ok:()=>{sent.days[k]=j}});
          else ops.push({p:'days/'+k,del:1,ok:()=>{delete sent.days[k]}});
        }});
      if(!ops.length){clean=true;break}
      setSync('saving');
      for(const o of ops){const r=DB.doc(o.p);if(o.del)await r.delete();else await r.set(o.b);o.ok()}
    }
    if(clean){localDirty=false;try{localStorage.removeItem(DIRTYKEY)}catch(e){}setSync('ok')}
  }catch(e){
    const c=e&&e.code;setSync('err');
    if(['invalid_argument','quota_exceeded','revoked'].includes(c))toast(c==='quota_exceeded'?'Penyimpanan server penuh':'Server menolak penyimpanan ('+c+')');
    else{clearTimeout(retryT);retryT=setTimeout(flush,10000)}
  }finally{flushing=false}
  if(clean&&localDirty)schedFlush();
}
function softRender(){const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){pendingRender=true;return}render()}
document.addEventListener('focusout',()=>{if(pendingRender){pendingRender=false;setTimeout(render,250)}});
function cacheLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
async function initDB(){
  if(typeof claude==='undefined'||!claude||!claude.use){startGH();return}
  let db=null;try{db=await claude.use('db')}catch(e){}
  if(!db){startGH();return}
  DB=db;BACK='db';setSync('load');
  const to=setTimeout(()=>{if(!ready)setSync('err')},10000);
  try{
    const [ms,ds]=await Promise.all([DB.doc('app/main').get(),DB.collection('days').get()]);
    clearTimeout(to);
    const srvDays={};ds.docs.forEach(d=>{srvDays[d.id]=d.data()});
    let dirty=false;try{dirty=localStorage.getItem(DIRTYKEY)==='1'}catch(e){}
    const hasLocal=S.emps.length||Object.values(S.days).some(d=>!isBlank(d))||S.ann.length||S.leaves.length;
    if(ms.exists&&!dirty){
      S=norm(Object.assign({},JSON.parse(JSON.stringify(ms.data())),{days:srvDays}));
      sent.main=st(mainBody());Object.keys(S.days).forEach(k=>{sent.days[k]=st(S.days[k])});
      cacheLocal();try{localStorage.removeItem(DIRTYKEY)}catch(e){}
      localDirty=false;
    }else{
      if(ms.exists)S.days=Object.assign({},srvDays,S.days);   // lokal belum terkirim: menang, hari lain dari server digabung
      Object.keys(srvDays).forEach(k=>{if(S.days[k]===srvDays[k])sent.days[k]=st(srvDays[k])});
      if(ms.exists&&!dirty)sent.main=st(mainBody());
      if(hasLocal||dirty)localDirty=true;
    }
    ready=true;
    setSync('ok');render();
    DB.doc('app/main').onSnapshot(snap=>{
      if(!snap.exists||snap.metadata.hasPendingWrites||localDirty||flushing)return;
      const body=JSON.parse(JSON.stringify(snap.data()));
      const cur=st(mainBody());
      const next=norm(Object.assign({},body,{days:S.days}));
      if(st((()=>{const m={};Object.keys(next).forEach(k=>{if(k!=='days')m[k]=next[k]});return m})())===cur)return;
      S=next;sent.main=st(mainBody());cacheLocal();softRender();
    },()=>setSync('err'));
    DB.collection('days').onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites||localDirty||flushing)return;
      let ch=false;
      snap.docChanges().forEach(c=>{
        const id=c.doc.id;
        if(c.type==='removed'){if(S.days[id]){delete S.days[id];delete sent.days[id];ch=true}return}
        const d=JSON.parse(JSON.stringify(c.doc.data()));
        if(!S.days[id]||st(S.days[id])!==st(d)){S.days[id]=d;sent.days[id]=st(d);ch=true}
      });
      if(ch){cacheLocal();softRender()}
    },()=>setSync('err'));
    if(localDirty)flush();
  }catch(e){clearTimeout(to);setSync('err');ready=false;DB=null;BACK='local';setTimeout(initDB,15000)}
}

const GHKEY='atur-karyawan-gh';

const ghSha={};let pollT=null,polling=false;
const saveGHC=()=>{try{if(GHC)localStorage.setItem(GHKEY,JSON.stringify(GHC));else localStorage.removeItem(GHKEY)}catch(e){}};
const ghPath=p=>'data/'+p;
const b64e=str=>{const u=new TextEncoder().encode(str);let b='';for(let i=0;i<u.length;i+=0x8000)b+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(b)};
const b64d=str=>new TextDecoder().decode(Uint8Array.from(atob(str.replace(/\s/g,'')),c=>c.charCodeAt(0)));
class GhErr extends Error{constructor(kind,msg,status){super(msg);this.kind=kind;this.status=status}}
async function ghApi(method,path,body,accept){
  let r;
  try{
    r=await fetch('https://api.github.com/repos/'+encodeURIComponent(GHC.owner)+'/'+encodeURIComponent(GHC.repo)+path,{method,cache:'no-store',
      headers:Object.assign({'Authorization':'Bearer '+GHC.token,'Accept':accept||'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body?{'Content-Type':'application/json'}:{}),
      body:body?JSON.stringify(body):undefined});
  }catch(e){throw new GhErr('net','Tidak bisa menghubungi GitHub (offline atau diblokir di halaman ini).')}
  let j=null;const txt=await r.text();try{j=JSON.parse(txt)}catch(e){j=txt}
  if(r.ok)return j;
  const m=(j&&j.message)||'';
  if(r.status===401)throw new GhErr('auth','Token tidak valid atau sudah kedaluwarsa. Buat token baru di GitHub.',401);
  if(r.status===403&&r.headers.get('x-ratelimit-remaining')==='0')throw new GhErr('rate','Batas akses GitHub tercapai, coba lagi nanti.',403);
  if(r.status===403)throw new GhErr('perm','Token tidak punya izin tulis. Atur izin "Contents: Read and write" untuk repo ini.',403);
  if(r.status===409||(r.status===422&&/sha/i.test(m)))throw new GhErr('conflict','Data berubah di perangkat lain.',r.status);
  if(r.status===404)throw new GhErr('nf',m||'Not Found',404);

    if(/[,;|\t]/.test(l)){const p=l.split(/[,;|\t]/).map(x=>x.trim());nama=p[0];
      if(p[1]&&!/^\d+$/.test(p[1])){pgl=p[1];nik=(p[2]||'').replace(/\s/g,'')}else{nik=(p[1]||'').replace(/\s/g,'');pgl=p[2]||''}}
    else{const m=l.match(/^(.*?)\s+(\d{5,})$/);if(m){nama=m[1];nik=m[2]}else nama=l}
    let zh='';if(/[,;|\t]/.test(l)){const c=l.split(/[,;|\t]/).map(x=>x.trim()).find(hasCJK);if(c){zh=c;if(pgl===c)pgl='';if(nik===c)nik=''}}
    nama=(nama||'').trim();return {nama,nik,pgl:(pgl||autoPgl(nama)).toLowerCase(),zh}
  }).filter(x=>x.nama)
}

    return `<div class="row"><div class="grow"><b data-nt>${esc(e?dn(e):T('(dihapus)'))}</b> <span class="badge ${st[1]}">${st[0]}</span><div class="mut sm">${esc(jenisL(l.jenis))} · ${fmtDMY(l.start)} – ${fmtDMY(l.end)}</div></div><button class="btn sm" data-act="editleave" data-id="${l.id}">Ubah</button><button class="x" data-act="delleave" data-id="${l.id}" aria-label="Hapus">🗑</button></div>`}).join('');
  return `<section class="card"><h3>${f.id?'Ubah':'Tambah'} cuti / izin</h3><div style="margin-top:10px">

   <label class="fld">Jenis<input data-bind="cf" data-f="jenis" list="jl" value="${esc(f.jenis)}"><datalist id="jl">${used.map(j=>`<option value="${esc(j)}">`).join('')}</datalist></label>
   <div class="g2"><label class="fld">Mulai<input type="date" data-bind="cf" data-f="start" value="${f.start}"></label><label class="fld">Selesai<input type="date" data-bind="cf" data-f="end" value="${f.end}"></label></div>
   <div style="display:flex;gap:8px"><button class="btn pri" data-act="savecuti">Simpan</button>${f.id?'<button class="btn" data-act="resetcf">Batal</button>':''}</div></div></section>
   <section class="card"><div class="h"><h3>Daftar cuti & izin</h3><span class="mut sm">${S.leaves.length}</span></div>${list||'<p class="mut">Belum ada pengajuan.</p>'}</section>`;
}
function vStat(){
  if(!S.emps.length)return needEmp();
  const dt=parse(UI.date),y=dt.getFullYear(),m=dt.getMonth(),n=new Date(y,m+1,0).getDate();
  const dates=[...Array(n)].map((_,i)=>y+'-'+pad(m+1)+'-'+pad(i+1));
  const act=S.emps.filter(e=>e.aktif),d=D(UI.date),onL=new Set(leavesOn(UI.date).map(l=>l.emp));
  const counts={};let sched=0;
  act.forEach(e=>{if(onL.has(e.id))return;const c=d.shift[e.id];if(c){counts[c]=(counts[c]||0)+1;sched++}});
  const free=Math.max(0,act.length-sched-onL.size);
  const codes=[...new Set(S.codes.concat(Object.keys(counts)))];
  const segs=codes.map(c=>[c,counts[c]||0,`hsl(${hue(c)} 65% 58%)`]).concat([['Cuti/izin',onL.size,'#5bb6e6'],['Belum diatur',free,'#d7dbe3']]).filter(x=>x[1]>0);
  const tot=segs.reduce((a,x)=>a+x[1],0);let acc=0;
  const stops=segs.map(x=>{const a=acc/tot*360;acc+=x[1];return `${x[2]} ${a}deg ${acc/tot*360}deg`}).join(',');
  const mc=new Set();dates.forEach(dd=>Object.values(D(dd).shift).forEach(c=>c&&mc.add(c)));
  const mcodes=[...new Set(S.codes.concat([...mc]))];
  const trs=act.map(e=>{
    const cs=mcodes.map(c=>dates.filter(dd=>D(dd).shift[e.id]===c&&!S.leaves.some(l=>l.emp===e.id&&l.start<=dd&&dd<=l.end)).length);
    const cuti=dates.filter(dd=>S.leaves.some(l=>l.emp===e.id&&l.start<=dd&&dd<=l.end)).length;
    return `<tr><td data-nt><b>${esc(LANG==='zh'?zhN(e):e.nama)}</b></td>${cs.map(v=>`<td>${v||'·'}</td>`).join('')}<td>${cuti||'·'}</td></tr>`}).join('');
  return `<div class="stats"><div class="stat"><b>${act.length}</b><span>Karyawan aktif</span></div><div class="stat"><b>${sched}</b><span>Terjadwal</span></div><div class="stat"><b>${onL.size}</b><span>Cuti / izin</span></div><div class="stat"><b>${free}</b><span>Belum diatur</span></div></div>
  <section class="card"><div class="h"><h3>Sebaran shift</h3><span class="badge" data-nt>${esc(dateL(UI.date))}</span></div>
   <div class="donutw"><div class="donut" style="background:${tot?`conic-gradient(${stops})`:'#eceef3'}"><div><b>${tot}</b><span>orang</span></div></div><div class="leg">${segs.map(x=>`<div><i style="background:${x[2]}"></i>${esc(x[0])}<b>${x[1]}</b></div>`).join('')||'<span class="mut">Belum ada data.</span>'}</div></div></section>
  <section class="card"><div class="h"><h3>Rekap ${BULAN[m]} ${y}</h3><span class="mut sm">jumlah hari</span></div><div class="tw"><table><thead><tr><th>Nama</th>${mcodes.map(c=>`<th>${esc(c)}</th>`).join('')}<th>Cuti</th></tr></thead><tbody>${trs}</tbody></table></div></section>`;
}

document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,ds=b.dataset;

  else if(a==='go'){UI.tab=ds.v;UI.cf=null;UI.qr=false;render();window.scrollTo(0,0);if(ds.s){const el=document.getElementById(ds.s)||document.getElementById('sec-'+ds.s);if(el){el.scrollIntoView({behavior:'smooth',block:'start'});if(/INPUT|TEXTAREA/.test(el.tagName))setTimeout(()=>el.focus({preventScroll:true}),350)}}}
  else if(a==='syncinfo'){if(SYNC==='local'&&UI.tab!=='server'){UI.tab='server';render();window.scrollTo(0,0);return}toast(SYNCMSG());if(SYNC==='err'){if(BACK==='gh'){ready?flush():initGH(false)}else if(BACK==='db'&&ready)flush();else if(!DB&&BACK!=='gh')initDB()}}
  else if(a==='ghshow'){const i=$('#gh-token');i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'Lihat':'Sembunyi'}
  else if(a==='ghconnect'){

    b.disabled=true;b.textContent='Menghubungkan…';
    await ghConnect(owner,repo,branch,token);render()}
  else if(a==='ghqr'){UI.qr=!UI.qr;clearInterval(UI.qrT);render();if(UI.qr){const end=Date.now()+120000;UI.qrT=setInterval(()=>{const l=Math.max(0,Math.round((end-Date.now())/1000));document.querySelectorAll('#qrleft,.qrleft').forEach(el=>{el.textContent=Math.floor(l/60)+':'+String(l%60).padStart(2,'0')});if(!l||!UI.qr||UI.tab!=='server'){clearInterval(UI.qrT);if(UI.qr){UI.qr=false;if(UI.tab==='server')render()}}},1000)}}
  else if(a==='ghcopylink'){if(await ask('Link ini berisi token akses data karyawan. Hanya buka di perangkat Anda sendiri dan jangan kirim ke orang lain. Salin?','Salin'))toast(await copyText(linkHubung())?'Link disalin ✓':'Gagal menyalin')}
  else if(a==='scanstart'){startScan()}
  else if(a==='scanclose'){stopScan()}
  else if(a==='ghsync'){if(!ready){initGH(false);return}if(localDirty)await flush();else await pollGH();toast(SYNC==='ok'?'Sudah sinkron ✓':SYNCMSG())}
  else if(a==='ghoff'){if(await ask('Putuskan server GitHub di perangkat ini? Data di repo tidak dihapus, dan data tetap ada di perangkat ini.','Putuskan')){ghDisconnect();render()}}
  else if(a==='lang'){LANG=LANG==='dual'?'id':LANG==='id'?'zh':'dual';try{localStorage.setItem(LANGKEY,LANG)}catch(e){}render();toast(LANG==='dual'?'Indonesia + 中文':LANG==='zh'?'中文':'Bahasa Indonesia')}
  else if(a==='zhauto'){const e=emp(ds.e);e.zh=zhName(e.nama);e.zhAuto=true;save();render()}
  else if(a==='zhall'){if(await ask('Buat ulang nama Mandarin semua karyawan secara otomatis? Nama yang sudah Anda ubah sendiri ikut diganti.','Buat ulang')){S.emps.forEach(e=>{e.zh=zhName(e.nama);e.zhAuto=true});save();render();toast('Nama Mandarin diperbarui')}}
  else if(a==='rename'){const v=await askText('Nama yang tampil di sapaan',S.nama);if(v!==null){S.nama=v.trim()||'Admin';save();render()}}

  else if(a==='savecuti'){
    const f=UI.cf;if(!f.emp||!f.jenis.trim()||!f.start||!f.end){toast('Lengkapi data dulu');return}

    UI.cf=null;save();render();toast('Tersimpan ✓')}
  else if(a==='editleave'){UI.cf=clone(S.leaves.find(l=>l.id===ds.id));render();window.scrollTo(0,0)}
  else if(a==='resetcf'){UI.cf=null;render()}
  else if(a==='delleave'){if(await ask('Hapus pengajuan ini?','Hapus')){S.leaves=S.leaves.filter(l=>l.id!==ds.id);save();render()}}
  else if(a==='backup'){toast(await copyText(JSON.stringify(S))?'Cadangan disalin ✓':'Gagal menyalin')}
  else if(a==='restore'){try{const o=norm(JSON.parse($('#rest').value));if(!o)throw 0;if(await ask('Ganti semua data dengan cadangan ini?','Pulihkan')){S=o;save();render();toast('Data dipulihkan ✓')}}catch(e){toast('Teks cadangan tidak valid')}}
  else if(a==='wipe'){if(await ask('Hapus SEMUA data karyawan, jadwal, dan cuti?','Hapus semua')){const n=S.nama;S=empty();S.nama=n;save();render()}}
});
document.addEventListener('input',ev=>{
  const t=ev.target,b=t.dataset.bind;if(!b)return;
  if(b==='kode'){W(UI.date).areas[+t.dataset.i].kode=t.value;save();refreshOutput()}
  else if(b==='label'){S.label=t.value;save();refreshOutput()}
  else if(b==='nasi'){W(UI.date).nasi=t.value;save();refreshOutput()}
  else if(b==='emp'){const e=emp(t.dataset.e),f=t.dataset.f;e[f]=t.value;if(f==='zh')e.zhAuto=false;if(f==='nama'&&e.zhAuto!==false){e.zh=zhName(t.value);e.zhAuto=true;const z=document.querySelector(`input[data-e="${e.id}"][data-f="zh"]`);if(z){z.value=e.zh;z.placeholder=e.zh}}save()}
  else if(b==='label_zh'){S.label_zh=t.value;save();refreshOutput()}
  else if(b==='judul_zh'){S.judul_zh=t.value;save();refreshOutput()}
  else if(b==='cf'){UI.cf[t.dataset.f]=t.value}
  else if(b==='judul'){S.judul=t.value;save();refreshOutput()}
  else if(b==='bulk'){$('#bulkinfo').textContent=parseBulk(t.value).length+' nama terdeteksi'}
});
document.addEventListener('change',ev=>{
  const t=ev.target,b=t.dataset.bind;
  if(t.id==='dpick'){if(t.value){UI.date=t.value;render()}return}
  if(!b)return;
  if(b==='gaya'){S.gaya=t.value;save();refreshOutput();refreshMasuk()}
  else if(b==='bahasa'){S.bahasa=t.value;save();render()}
  else if(b==='aktif'){emp(t.dataset.e).aktif=t.checked;save();render()}
  else if(b==='addchip'){const v=t.value.split(',').map(x=>x.trim()).filter(Boolean);if(!v.length)return;listOf(W(UI.date),t.dataset.t).push(...v);save();UI.focus=t.dataset.t;render()}
  else if(b==='addcode'){const v=t.value.trim();if(v&&!S.codes.includes(v)){S.codes.push(v);save();render()}}
});
document.addEventListener('keydown',ev=>{
  const t=ev.target;
  if(ev.key==='Enter'&&t.dataset&&['addchip','addcode'].includes(t.dataset.bind))t.blur();
  if(ev.key==='Enter'&&t.id==='annin'){ev.preventDefault();document.querySelector('[data-act=postann]').click()}
});
render();
initDB();
</script>
</body>
</html>
